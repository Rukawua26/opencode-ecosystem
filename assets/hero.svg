  <text x="515" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">Prompts · TDD</text>
  <rect x="670" y="190" width="210" height="120" rx="16" fill="#1e1e3a" stroke="#48dbfb" stroke-width="1.5" opacity="0.9" filter="url(#shadow)"/>
  <text x="775" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#48dbfb" font-weight="bold">🤖 16+ Agents</text>
  <text x="775" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">Backend · Frontend</text>
  <text x="775" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">Security · DevOps</text>
  <text x="775" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">Debug · Multi-model</text>
  <rect x="930" y="190" width="210" height="120" rx="16" fill="#1e1e3a" stroke="#ff9ff3" stroke-width="1.5" opacity="0.9" filter="url(#shadow)"/>
  <text x="1035" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ff9ff3" font-weight="bold">🔌 Plugins</text>
  <text x="1035" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">8 integrated</text>
  <text x="1035" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">Kanban · MCP</text>
  <text x="1035" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">Checkpoints · Sandbox</text>
  <line x1="360" y1="250" x2="410" y2="250" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
  <line x1="620" y1="250" x2="670" y2="250" stroke="#feca57" stroke-width="1" opacity="0.3"/>
  <line x1="880" y1="250" x2="930" y2="250" stroke="#48dbfb" stroke-width="1" opacity="0.3"/>
