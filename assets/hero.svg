<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode Ecosystem</title>
  <desc id="desc">Editorial cover showing a terminal workspace for a local-first OpenCode installation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d12"/>
      <stop offset="0.58" stop-color="#111923"/>
      <stop offset="1" stop-color="#18222d"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7d154"/>
      <stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <pattern id="noise" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fff" opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#background)"/>
  <rect width="1200" height="520" rx="30" fill="url(#noise)"/>
  <path d="M0 390 C240 330 375 480 610 405 C845 330 990 350 1200 250 V520 H0Z" fill="#0c1118" opacity="0.74"/>
  <circle cx="1085" cy="88" r="154" fill="#f7d154" opacity="0.055"/>
  <circle cx="1075" cy="84" r="92" fill="none" stroke="#f7d154" stroke-width="2" opacity="0.12"/>

  <g transform="translate(70 70)">
    <rect width="164" height="34" rx="17" fill="#f7d154"/>
    <text x="82" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#16120a" letter-spacing="1.6">LOCAL FIRST</text>

    <text x="0" y="112" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="800" fill="#f5f7fa" letter-spacing="-3">OpenCode</text>
    <text x="0" y="178" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="800" fill="url(#signal)" letter-spacing="-3">Ecosystem</text>
    <rect x="2" y="205" width="62" height="5" rx="2.5" fill="#f7d154"/>

    <text x="0" y="258" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" fill="#aeb9c6">Una instalacion reproducible para trabajar con</text>
    <text x="0" y="290" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" fill="#aeb9c6">agentes, memoria local y modelos bajo control.</text>

    <g transform="translate(0 334)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#778493">
      <text x="0" y="0">MEMORY</text>
      <circle cx="86" cy="-5" r="3" fill="#f7d154"/>
      <text x="104" y="0">SKILLS</text>
      <circle cx="166" cy="-5" r="3" fill="#f7d154"/>
      <text x="184" y="0">ROUTING</text>
      <circle cx="260" cy="-5" r="3" fill="#f7d154"/>
      <text x="278" y="0">REVIEW</text>
    </g>
  </g>

  <g transform="translate(650 82)" filter="url(#soft-shadow)">
    <rect width="470" height="346" rx="18" fill="#10161e" stroke="#394654" stroke-width="1.5"/>
    <rect width="470" height="46" rx="18" fill="#1b2530"/>
    <rect y="30" width="470" height="16" fill="#1b2530"/>
    <circle cx="24" cy="23" r="6" fill="#ff6b5f"/>
    <circle cx="44" cy="23" r="6" fill="#f7c948"/>
    <circle cx="64" cy="23" r="6" fill="#55c98b"/>
    <text x="235" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8492a1">opencode / workspace</text>

    <g transform="translate(28 78)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <text x="0" y="0" fill="#f7d154">$</text>
      <text x="20" y="0" fill="#dbe4ec">bash install.sh --sync --dry-run</text>
      <text x="0" y="34" fill="#96a6b5">[dry-run]</text>
      <text x="86" y="34" fill="#55c98b">preserve</text>
      <text x="164" y="34" fill="#aeb9c6">opencode.jsonc</text>
      <text x="0" y="62" fill="#96a6b5">[dry-run]</text>
      <text x="86" y="62" fill="#65b8ff">update</text>
      <text x="148" y="62" fill="#aeb9c6">managed tools</text>
      <text x="0" y="90" fill="#96a6b5">[dry-run]</text>
      <text x="86" y="90" fill="#f7d154">backup</text>
      <text x="148" y="90" fill="#aeb9c6">before replace</text>

      <text x="0" y="140" fill="#f7d154">$</text>
      <text x="20" y="140" fill="#dbe4ec">opencode-doctor --json</text>

      <rect x="0" y="164" width="414" height="78" rx="10" fill="#18212b" stroke="#2a3744"/>
      <text x="18" y="190" fill="#aeb9c6">format</text>
      <text x="112" y="190" fill="#55c98b">JSON v1</text>
      <text x="18" y="218" fill="#aeb9c6">mode</text>
      <text x="112" y="218" fill="#55c98b">read-only</text>
    </g>
  </g>

  <g transform="translate(650 452)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
    <text x="0" y="0" fill="#718091">LINUX</text>
    <text x="72" y="0" fill="#718091">MACOS</text>
    <text x="150" y="0" fill="#718091">WINDOWS</text>
    <text x="252" y="0" fill="#718091">NODE 22+</text>
    <rect x="340" y="-12" width="95" height="24" rx="12" fill="#f7d154" opacity="0.12"/>
    <text x="387" y="4" text-anchor="middle" fill="#f7d154">MIT</text>
  </g>
</svg>
