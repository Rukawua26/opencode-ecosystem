<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#48dbfb"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9ff3"/>
      <stop offset="50%" stop-color="#54a0ff"/>
      <stop offset="100%" stop-color="#5f27cd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)" rx="20"/>
  <circle cx="100" cy="80" r="80" fill="url(#accent1)" opacity="0.08"/>
  <circle cx="1100" cy="320" r="100" fill="url(#accent2)" opacity="0.08"/>
  <circle cx="600" cy="200" r="180" fill="url(#accent1)" opacity="0.04"/>
  <circle cx="300" cy="350" r="60" fill="#ff6b6b" opacity="0.06"/>
