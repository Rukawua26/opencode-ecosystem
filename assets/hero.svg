  <text x="255" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">SQLite + FTS5</text>
  <text x="255" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">MCP Server</text>
  <text x="255" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">Universal</text>
  <rect x="410" y="190" width="210" height="120" rx="16" fill="#1e1e3a" stroke="#feca57" stroke-width="1.5" opacity="0.9" filter="url(#shadow)"/>
  <text x="515" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#feca57" font-weight="bold">⚡ Skills</text>
  <text x="515" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">20 exportables</text>
