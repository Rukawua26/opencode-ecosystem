  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#accent1)" filter="url(#glow)">OpenCode Ecosystem</text>
  <text x="600" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a0a0c0">v1.3.0 — Token-Efficient · Secure Memory · Multi-Agent</text>
  <rect x="150" y="190" width="210" height="120" rx="16" fill="#1e1e3a" stroke="#ff6b6b" stroke-width="1.5" opacity="0.9" filter="url(#shadow)"/>
