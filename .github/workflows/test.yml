name: CI - Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release version from package.json (for example 1.10.0)"
        required: true
        type: string

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Install MCP router dependencies
        run: npm ci --prefix config/mcp --omit=dev --ignore-scripts

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high

      - name: Run lint
        run: npm run lint

      - name: Run documentation and contract checks
        run: npm run check-docs

      - name: Run vitest tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run memory-adapter tests (node:test)
        run: node --test packages/memory-adapter/tests/*.test.js

      - name: Run local-model-router tests (node:test)
        run: npm run test:router

      - name: Run install test
        run: npm run test:install
        env:
          HOME: /tmp/test-home

      - name: Run hook safety test
        run: npm run test:hooks

      - name: Run release tag contract test
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:release

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install MCP router dependencies
        run: npm ci --prefix config/mcp --omit=dev --ignore-scripts

      - name: Run vitest tests
        run: npx vitest run

      - name: Run memory-adapter tests (node:test)
        run: node --test packages/memory-adapter/tests/*.test.js

      - name: Run local-model-router tests (node:test)
        run: npm run test:router

      - name: Run PowerShell install test
        run: npm run test:install:windows

  install-validation:
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install git
        run: apk add --no-cache git bash

      - name: Run install.sh
        run: |
          mkdir -p /tmp/test-home
          HOME=/tmp/test-home bash install.sh --verbose --skip-memory

      - name: Verify structure
        run: |
          test -f /tmp/test-home/.config/opencode/opencode.jsonc
          test -d /tmp/test-home/.config/opencode/agents
          test -d /tmp/test-home/.config/opencode/plugins
          test -d /tmp/test-home/.config/opencode/mcp
          test -d /tmp/test-home/opencode-custom/skills
          echo "Install validation OK"

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [test, test-windows, install-validation]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install release dependencies
        run: npm ci

      - name: Configure git remote with PAT
        run: git remote set-url origin https://x-access-token:${{ secrets.ECOSYSTEMAPUBLISH2 }}@github.com/${{ github.repository }}.git

      - name: Create version tag
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEMAPUBLISH2 }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$REQUESTED_VERSION" ]; then
            echo "Requested version $REQUESTED_VERSION does not match package.json $VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            bash tools/scripts/verify-release-tag.sh "$TAG" "$GITHUB_SHA"
            echo "$TAG already exists; continuing idempotent publication checks."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Restore public git remote
        if: always()
        run: git remote set-url origin https://github.com/${{ github.repository }}.git

      - name: Create GitHub release for latest tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes --latest

      - name: Publish memory-adapter to npm
        working-directory: packages/memory-adapter
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            PUBLISHED_GIT_HEAD=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" gitHead)
            test "$PUBLISHED_GIT_HEAD" = "$GITHUB_SHA" || { echo "$PACKAGE_NAME@$PACKAGE_VERSION was published from $PUBLISHED_GIT_HEAD, not $GITHUB_SHA" >&2; exit 1; }
          else
            npm publish --access public --provenance
          fi

      - name: Publish skills to npm
        working-directory: packages/skills
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            PUBLISHED_GIT_HEAD=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" gitHead)
            test "$PUBLISHED_GIT_HEAD" = "$GITHUB_SHA" || { echo "$PACKAGE_NAME@$PACKAGE_VERSION was published from $PUBLISHED_GIT_HEAD, not $GITHUB_SHA" >&2; exit 1; }
          else
            npm publish --access public --provenance
          fi
