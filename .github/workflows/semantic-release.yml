name: Semantic Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Debug PAT scopes
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEMAPUBLISH2 }}
        run: |
          echo "PAT scopes:"
          curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/user | node -e "const d=require('fs').readFileSync(0,'utf8');const j=JSON.parse(d);console.log('User:', j.login);console.log('Scopes:', j.scopes || 'N/A')"
          echo "---"
          echo "Repo access:"
          curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/${{ github.repository }} | node -e "const d=require('fs').readFileSync(0,'utf8');const j=JSON.parse(d);console.log('Repo:', j.full_name);console.log('Permissions:', JSON.stringify(j.permissions || {}))"

      - name: Configure git remote with PAT
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.ECOSYSTEMAPUBLISH2 }}@github.com/${{ github.repository }}.git

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEMAPUBLISH2 }}
          GITHUB_TOKEN: ${{ secrets.ECOSYSTEMAPUBLISH2 }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      - name: Restore remote URL
        if: always()
        run: git remote set-url origin https://github.com/${{ github.repository }}.git
