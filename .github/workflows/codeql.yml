name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4

      - name: Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          upload: never
          upload-database: false

      - name: Preserve CodeQL results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_attempt }}
          path: ${{ steps.codeql.outputs.sarif-output }}
          retention-days: 14

      - name: Reject high-severity CodeQL findings
        env:
          SARIF_DIR: ${{ steps.codeql.outputs.sarif-output }}
        run: |
          jq -s -e '
            [.[] | .runs[] | . as $run | $run.results[]? | . as $result
              | ((if ($result.rule.toolComponent.index? != null and $result.rule.index? != null)
                  then $run.tool.extensions[$result.rule.toolComponent.index].rules[$result.rule.index]
                  elif $result.ruleIndex? != null then $run.tool.driver.rules[$result.ruleIndex]
                  else null end)
                // ([$run.tool.driver.rules[]?, $run.tool.extensions[]?.rules[]?]
                    | map(select(.id == $result.ruleId)) | first)
                // error("unmapped SARIF rule: \($result.ruleId // "unknown")")) as $rule
              | ($rule.properties["security-severity"] // "0" | tonumber) as $severity
              | select(($result.level // $rule.defaultConfiguration.level // "warning") == "error" or $severity >= 7)]
            | length == 0
          ' "$SARIF_DIR"/*.sarif
