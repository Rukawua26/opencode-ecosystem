name: Install Script Test

on:
  push:
    paths:
      - "install.sh"
      - ".github/workflows/install-test.yml"
  pull_request:
    paths:
      - "install.sh"
      - ".github/workflows/install-test.yml"

jobs:
  test-install-linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
      - name: Run install.sh
        run: |
          mkdir -p /tmp/home
          HOME=/tmp/home bash install.sh --verbose --skip-memory
      - name: Verify install
        run: |
          test -f /tmp/home/.config/opencode/opencode.jsonc
          test -d /tmp/home/.config/opencode/agents
          test -d /tmp/home/.config/opencode/plugins
          test -d /tmp/home/.config/opencode/mcp
          test -d /tmp/home/opencode-custom/skills

  test-install-alpine:
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - name: Install system dependencies
        run: apk add --no-cache git bash curl
      - uses: actions/checkout@v7.0.1
      - name: Run install.sh
        run: |
          mkdir -p /tmp/home
          HOME=/tmp/home bash install.sh --verbose --skip-memory
      - name: Verify install
        run: |
          test -f /tmp/home/.config/opencode/opencode.jsonc
          test -d /tmp/home/.config/opencode/agents
          test -d /tmp/home/.config/opencode/plugins
          test -d /tmp/home/.config/opencode/mcp
          test -d /tmp/home/opencode-custom/skills

  test-install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
      - name: Run install.sh
        run: |
          mkdir -p /tmp/home
          HOME=/tmp/home bash install.sh --verbose --skip-memory
      - name: Verify install
        run: |
          test -f /tmp/home/.config/opencode/opencode.jsonc
          test -d /tmp/home/.config/opencode/agents
          test -d /tmp/home/.config/opencode/plugins
          test -d /tmp/home/.config/opencode/mcp
          test -d /tmp/home/opencode-custom/skills
