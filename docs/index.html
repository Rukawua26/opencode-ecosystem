<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OpenCode Ecosystem</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Ecosistema open source para potenciar OpenCode con memoria persistente, SDD, skills, multi-modelo y multiagentes.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #6366f1;
      --link-color: #818cf8;
      --sidebar-width: 260px;
      --sidebar-nav-link-color--active: #6366f1;
      --sidebar-nav-link-border-color--active: #6366f1;
      --cover-background-color: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      --cover-heading-color: #feca57;
      --cover-color: #a0a0c0;
      --cover-button-primary-background: #6366f1;
      --cover-button-primary-color: #fff;
      --cover-blockquote-background: rgba(99,102,241,0.1);
      --cover-blockquote-border-color: #6366f1;
    }
    .cover-main img { max-width: 300px; }
    .markdown-section h1 { color: #6366f1; }
    .markdown-section h2 { color: #818cf8; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    .markdown-section code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    .markdown-section pre { background: #1e293b; color: #e2e8f0; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="app">Cargando...</div>
  <script>
    window.$docsify = {
      name: 'OpenCode Ecosystem',
      repo: 'https://github.com/Rukawua26/opencode-ecosystem',
      loadSidebar: true,
      coverpage: true,
      subMaxLevel: 3,
      search: 'placeholder',
      auto2top: true,
      mergeNavbar: true,
      coverpage: {
        '/': '_coverpage.md',
      },
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    window.$docsify.markdown = {
      renderer: {
        code: function(code, lang) {
          if (lang === 'mermaid') {
            return '<div class="mermaid">' + code + '</div>';
          }
          return this.origin.code.apply(this, arguments);
        }
      }
    };
  </script>
</body>
</html>
